name: Talyntra CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Run Unit Tests & E2E Smoke Tests
        run: npm test

      - name: Run Skill Extraction Evaluation Harness
        run: npm run eval

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies & Run Pytest
        run: |
          pip install -r backend/requirements.txt
          python -m unittest discover -s backend/app -p "*.py" || true

      - name: Production Build
        run: npm run build

